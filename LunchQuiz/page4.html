<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overwatch World Quiz - Page 4</title>
  <link rel="stylesheet" href="quizStyle.css" />
</head>

<body>
  <main class="quiz-container">
    <nav class="quiz-nav">
      <a href="../index.html">Home</a>
      <a href="../about.html">About</a>
      <a href="../extra.html">Extra</a>
    </nav>

    <header class="quiz-hero compact-hero">
      <p class="eyebrow">Project 4 Quiz</p>
      <h1>Core & Future</h1>
      <p class="intro">The last page looks at your inner center and the future you would want to help build.</p>
    </header>

    <p class="progress">Page 4 of 4</p>

    <form id="overwatchQuiz" class="quiz-form" data-final="true">
      <section class="question-block">
        <h2>7. Choose the word that feels closest to your core.</h2>
        <div class="options compact">
          <label><input type="radio" name="core" value="hope" required /> Hope</label>
          <label><input type="radio" name="core" value="honor" /> Honor</label>
          <label><input type="radio" name="core" value="curiosity" /> Curiosity</label>
          <label><input type="radio" name="core" value="freedom" /> Freedom</label>
          <label><input type="radio" name="core" value="discipline" /> Discipline</label>
          <label><input type="radio" name="core" value="joy" /> Joy</label>
        </div>
      </section>

      <section class="question-block">
        <h2>8. What future would you want to help build?</h2>
        <div class="options">
          <label><input type="radio" name="future" value="peace" required /> A peaceful future where people heal together</label>
          <label><input type="radio" name="future" value="justice" /> A just future where the powerful are accountable</label>
          <label><input type="radio" name="future" value="innovation" /> A brilliant future shaped by science and imagination</label>
          <label><input type="radio" name="future" value="liberation" /> A freer future where no one is owned or controlled</label>
        </div>
      </section>

      <div class="page-actions">
        <a class="secondary-button" href="page3.html">Back</a>
        <button type="submit">Reveal My Hero</button>
      </div>
    </form>
  </main>

  <script src="quizScript.js"></script>
</body>
</html>
